name: linguo_reader
description: AI 语境阅读器 —— 导入 EPUB/TXT 电子书，点击单词或句子获取大模型结合上下文的释义与长难句解析。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.2.0
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # ── 状态管理 ──
  provider: ^6.1.1

  # ── 数据持久化 ──
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2

  # ── 文件操作 ──
  file_picker: ^6.1.1
  permission_handler: ^11.2.0
  path: ^1.8.3

  # ── EPUB / TXT 解析 ──
  epubx: ^4.0.0

  # ── 网络 / HTTP ──
  dio: ^5.4.0

  # ── UI 组件 ──
  flutter_html: ^3.0.0-beta.2

  # ── 工具类 ──
  uuid: ^4.2.1
  intl: ^0.19.0
  logger: ^2.0.2+1
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
