name: Build Android Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 环境 (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 自动修正 Android 工程配置并保留应用源码
        run: |
          cd linguo_reader || true
          # 1. 备份真正的业务代码 lib 目录
          cp -r lib lib_backup
          
          # 2. 重新生成干净正确的 Android 原生构建配置
          flutter create --platforms=android . --overwrite
          
          # 3. 还原真正的业务代码（防止变成 demo 计数器）
          rm -rf lib
          cp -r lib_backup lib

      - name: 获取依赖
        run: |
          cd linguo_reader || true
          flutter pub get

      - name: 构建 Release APK
        run: |
          cd linguo_reader || true
          flutter build apk --release --no-tree-shake-icons

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            linguo_reader/build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk
